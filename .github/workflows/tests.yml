name: tests

on:
  push:
    branches: [main]
  pull_request:

# Workflow level: both jobs run tests and report, neither writes to the forge, and a job
# added later inherits read-only instead of the repository default of read/write (#32).
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # markdown-it-py is not a test tool, it is the assembler's one dependency, and the
      # suite over scripts/assemble_changelog.py cannot reach a single assertion without
      # it -- the script refuses to run rather than fall back to text scanning. Absent
      # here, that whole suite errored on every leg, so the heading refusal, the raw-HTML
      # refusal and the fence state machine had never been exercised on a runner at all;
      # they passed locally because the package happened to be installed there. The
      # changelog workflow learned this the same way and the lesson was applied to that
      # one file only. tests/test_workflow_dependencies.py now holds both against
      # scaffold.ASSEMBLER_DEPENDENCIES, which is where the package name is declared.
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov markdown-it-py
      - name: Run tests
        run: pytest

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Syntax-check every script
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning $(git ls-files '*.sh')
