# The Python floor, and the only place it is declared (#410).
#
# Until this key existed the only floor anywhere was the CI matrix in
# .github/workflows/tests.yml, and a matrix says what is TESTED, not what is
# SUPPORTED. The two were read as one throughout -- including by the README's
# `python-3.9+` badge, which made the claim with nothing behind it. The absence was
# not inert: the fix/398 lane declined to put a `sys.version_info` gate in
# scripts/doctor.sh's sentinel probe precisely because doing so would have turned a
# working 3.8 install into `VERDICT: could not run` on the strength of a fact this
# project had never stated.
#
# 3.9 is a decision, not a derivation, and it is deliberately WIDER than what the
# code needs. Measured over all 132 tracked .py files: every one parses at
# `feature_version=(3, 7)`, there are no builtin-generic or `X | Y` annotations, and
# no post-3.9 standard library name (no tomllib, no functools.cache, no Path.walk).
# The floor is 3.9 because 3.9 is the oldest version anything here has ever been
# demonstrated on, which is a support statement rather than a technical bound.
#
# No `version` key, on purpose. scripts/oss_config.py's VERSION_CANDIDATES probes
# `pyproject.toml` for exactly `[project] version`; adding one would make this a
# fifth version site, and .oss.json's `version_sites` names four others, so
# /oss:release would leave it stale. No `[build-system]` either: nothing builds or
# installs this repository as a package -- it is a Claude Code plugin -- and adding a
# backend to satisfy a table nobody reads would be furniture for its own sake.
#
# tests/test_python_floor_410.py holds this key against the four sites that have to
# agree with it, since none of them can read a manifest key at parse time.
[project]
name = "claude-oss"
requires-python = ">=3.9"

# #635 -- 250 tracked .py files had no linter anywhere, write-time or CI.
#
# The ruleset is small and deliberate, picked by hand rather than by adopting
# ruff's defaults: measured against this tree, `ruff check` with no `--select`
# (ruff's own default set) reports 2863 findings, most of them `UP*` -- style
# rules that assume a newer interpreter than the `requires-python` floor above
# and would flag deliberate 3.9-compatibility decisions (`.format()` over an
# f-string, no `X | Y` annotations) as errors. Selected instead are five rules
# with teeth and nothing to do with style: F401 (unused import), F841 (unused
# local), E722 (bare `except:`), B006 (mutable default argument), A001
# (parameter/variable shadows a builtin). `UP*` and everything else stay off.
#
# `target-version` matches `requires-python` above rather than being guessed
# independently -- a second copy of the floor that could drift from the first.
#
# No count-to-zero policy: measured at #635, this selection reports 95
# findings spread across 51 files, none of them inside that issue's own
# claimed scope. `scripts/ruff_ratchet.py` freezes that count as a CI-leg
# ratchet instead -- see its own docstring for why fixing 51 unrelated files
# in one lane was declined, and .supertool.json for the write-time half
# (`validators.ruff`), which fires per-file on every write/edit and never
# blocks -- a lint finding is not a broken file, matching this repo's own
# `markdownlint`/`shellcheck` convention of report-don't-revert.
[tool.ruff]
target-version = "py39"

# `.oss/` is an OWNED path (CLAUDE.md's ownership table): this plugin replaces
# every file in it wholesale on each `/oss:scaffold` run, so anything a
# formatter or a lint autofix writes there is reverted at the next scaffold --
# and, before that, renders in `/oss:doctor`'s own `owned files` line as a repo
# whose copy "would change" if re-scaffolded. Excluded from ruff on both sides
# for that reason, not because the code there is exempt from standards.
# `force-exclude` is what makes the exclusion hold when ruff is handed the file
# path directly, which is exactly how the write-time formatter below invokes it.
# Measured before excluding it: `ruff check .oss/` reported 0 findings, so the
# `ruff_ratchet.py` baseline is unchanged by this.
extend-exclude = [".oss"]
force-exclude = true

[tool.ruff.lint]
select = ["F401", "F841", "E722", "B006", "A001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `must_assert_on(platform)` -- #430. A promise, on the test itself, that it
# must run its real assertion (never SKIP) on the named platform; registered
# here so an unregistered typo warns rather than silently applying nothing.
# tests/must_assert_plugin.py is what holds the promise to account.
markers = [
    "must_assert_on(platform): fails the whole session if this test is SKIPPED while sys.platform == platform (#430)",
]
# `-rs` prints the reason behind every skip. A skipped check is this plugin
# saying it could not answer, and that third state only pays for itself if the
# reason reaches a human. Rendered as a bare `s`, a green run with silent skips
# looks identical to a green run that checked everything.
#
# The floor is a backstop, not the goal. It sits just under what the suite earns
# today (90%) so a regression trips it, and it is deliberately not raised to the
# current number -- a floor equal to reality fails on the first honest refactor.
#
# doctor.py is driven both in-process and as a subprocess. Coverage cannot see
# inside the subprocess, so the subprocess suite alone reported 0% for a file it
# exercises thoroughly. That is this plugin's own defect class -- a measurement
# claiming absence -- so both routes exist on purpose.
#
# `--durations=25` is #881 step 1: nothing here could say which tests are slow --
# every CI leg reported one total and a pass count, and a 4-second test and a
# 4-millisecond test were indistinguishable in every artifact CI produces. This
# is the whole of that step, deliberately: no test was touched, no optimisation
# made, no pytest-xdist added. Putting the flag here rather than as a workflow-only
# `pytest --durations=25` means every leg's CI log carries the slowest tests for
# every OS and every interpreter, AND a contributor running the documented
# `python3 -m pytest tests/ -q` locally gets the same visibility for free -- the
# same reasoning `CLAUDE.md` already applies to `-rs`.
#
# A CI log is retained the same way an uploaded artifact would be (default 90
# days per repository setting), so it already satisfies "readable after the fact,
# for any past run within that window" -- the maintainer's own bar -- without a
# second artifact. A JUnit-XML route (`--junitxml=`, uploaded, plus a summary
# script) was considered and rejected for this step: nothing in this repository
# produces a junit.xml today and no post-processing script exists, so that route
# is a second, larger issue (a new script, a new workflow step, an upload-artifact
# call) rather than the one line #881 step 1 asks for. If per-test timings need to
# survive past the log retention window, or be machine-comparable across runs,
# that is exactly the kind of decision step 3 says to make from real numbers --
# not before they exist.
addopts = "-rs --cov=scripts --cov-report=term-missing --cov-fail-under=85 --durations=25"

[tool.coverage.run]
# assemble_changelog.py came from claude-supertool, where it carries its own suite.
# Measuring it here would drag the floor down to a number that says nothing about
# this plugin's own code.
#
# NO LONGER VERBATIM, and that was the stated condition for this omission being
# honest. assemble_changelog.py now diverges in exactly one place: UNTAGGED_RELEASES
# is emptied. It arrived listing 0.11.0 through 0.19.0 -- another repo's untagged
# releases -- and reported nine findings about a release history this project has
# never had. The divergence is one constant, guarded by a test, and the debt is
# named rather than filed away: adopting this properly means bringing its suite
# across.
#
# It is the only vendored copy left. The second one was deleted by #253: it was
# wired into nothing, and an unmeasured file that nothing runs is not a debt, it is
# a document. tests/test_unwired_scripts_253.py is what notices the next one.
omit = [
    "scripts/assemble_changelog.py",
]
