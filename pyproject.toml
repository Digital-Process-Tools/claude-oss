# The Python floor, and the only place it is declared (#410).
#
# Until this key existed the only floor anywhere was the CI matrix in
# .github/workflows/tests.yml, and a matrix says what is TESTED, not what is
# SUPPORTED. The two were read as one throughout -- including by the README's
# `python-3.9+` badge, which made the claim with nothing behind it. The absence was
# not inert: the fix/398 lane declined to put a `sys.version_info` gate in
# scripts/doctor.sh's sentinel probe precisely because doing so would have turned a
# working 3.8 install into `VERDICT: could not run` on the strength of a fact this
# project had never stated.
#
# 3.9 is a decision, not a derivation, and it is deliberately WIDER than what the
# code needs. Measured over all 132 tracked .py files: every one parses at
# `feature_version=(3, 7)`, there are no builtin-generic or `X | Y` annotations, and
# no post-3.9 standard library name (no tomllib, no functools.cache, no Path.walk).
# The floor is 3.9 because 3.9 is the oldest version anything here has ever been
# demonstrated on, which is a support statement rather than a technical bound.
#
# No `version` key, on purpose. scripts/oss_config.py's VERSION_CANDIDATES probes
# `pyproject.toml` for exactly `[project] version`; adding one would make this a
# fifth version site, and .oss.json's `version_sites` names four others, so
# /oss:release would leave it stale. No `[build-system]` either: nothing builds or
# installs this repository as a package -- it is a Claude Code plugin -- and adding a
# backend to satisfy a table nobody reads would be furniture for its own sake.
#
# tests/test_python_floor_410.py holds this key against the four sites that have to
# agree with it, since none of them can read a manifest key at parse time.
[project]
name = "claude-oss"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `must_assert_on(platform)` -- #430. A promise, on the test itself, that it
# must run its real assertion (never SKIP) on the named platform; registered
# here so an unregistered typo warns rather than silently applying nothing.
# tests/must_assert_plugin.py is what holds the promise to account.
markers = [
    "must_assert_on(platform): fails the whole session if this test is SKIPPED while sys.platform == platform (#430)",
]
# `-rs` prints the reason behind every skip. A skipped check is this plugin
# saying it could not answer, and that third state only pays for itself if the
# reason reaches a human. Rendered as a bare `s`, a green run with silent skips
# looks identical to a green run that checked everything.
#
# The floor is a backstop, not the goal. It sits just under what the suite earns
# today (90%) so a regression trips it, and it is deliberately not raised to the
# current number -- a floor equal to reality fails on the first honest refactor.
#
# doctor.py is driven both in-process and as a subprocess. Coverage cannot see
# inside the subprocess, so the subprocess suite alone reported 0% for a file it
# exercises thoroughly. That is this plugin's own defect class -- a measurement
# claiming absence -- so both routes exist on purpose.
addopts = "-rs --cov=scripts --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
# assemble_changelog.py came from claude-supertool, where it carries its own suite.
# Measuring it here would drag the floor down to a number that says nothing about
# this plugin's own code.
#
# NO LONGER VERBATIM, and that was the stated condition for this omission being
# honest. assemble_changelog.py now diverges in exactly one place: UNTAGGED_RELEASES
# is emptied. It arrived listing 0.11.0 through 0.19.0 -- another repo's untagged
# releases -- and reported nine findings about a release history this project has
# never had. The divergence is one constant, guarded by a test, and the debt is
# named rather than filed away: adopting this properly means bringing its suite
# across.
#
# It is the only vendored copy left. The second one was deleted by #253: it was
# wired into nothing, and an unmeasured file that nothing runs is not a debt, it is
# a document. tests/test_unwired_scripts_253.py is what notices the next one.
omit = [
    "scripts/assemble_changelog.py",
]
